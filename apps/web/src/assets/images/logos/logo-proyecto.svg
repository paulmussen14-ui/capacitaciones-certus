  <text x="274" y="63" text-anchor="middle" font-family="'Segoe UI', system-ui, Roboto, sans-serif" font-size="12" font-weight="800" fill="#ffffff" letter-spacing="2.5" textLength="58" lengthAdjust="spacing">CERTUS</text>
